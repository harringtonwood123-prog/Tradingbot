[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wickfill"
version = "0.1.0"
description = "Long-only Wick Fill scanner, alert and paper-trading assistant (educational)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wickfill = "wickfill.cli:main"

[tool.setuptools]
packages = ["wickfill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
